packages:
  - apps/*
  - packages/*
  - packages/create-discord-bot/template/**/*

allowBuilds:
  '@discordjs/opus': true
  '@tailwindcss/oxide': true
  bufferutil: true
  core-js-pure: false
  esbuild: true
  protobufjs: true
  rclone.js: true
  sharp: true
  unrs-resolver: false
  utf-8-validate: true
  workerd: true
  zlib-sync: true

autoInstallPeers: false

minimumReleaseAgeExclude:
  # This is here temporarily as the package needs to be out for 24 hours
  - '@snazzah/davey-android-arm-eabi@0.2.0'
  - '@snazzah/davey-android-arm64@0.2.0'
  - '@snazzah/davey-darwin-arm64@0.2.0'
  - '@snazzah/davey-darwin-x64@0.2.0'
  - '@snazzah/davey-freebsd-x64@0.2.0'
  - '@snazzah/davey-linux-arm-gnueabihf@0.2.0'
  - '@snazzah/davey-linux-arm64-gnu@0.2.0'
  - '@snazzah/davey-linux-arm64-musl@0.2.0'
  - '@snazzah/davey-linux-x64-gnu@0.2.0'
  - '@snazzah/davey-linux-x64-musl@0.2.0'
  - '@snazzah/davey-wasm32-wasi@0.2.0'
  - '@snazzah/davey-win32-arm64-msvc@0.2.0'
  - '@snazzah/davey-win32-ia32-msvc@0.2.0'
  - '@snazzah/davey-win32-x64-msvc@0.2.0'
  - '@snazzah/davey@0.2.0'

patchedDependencies:
  '@microsoft/tsdoc-config@0.17.1': patches/@microsoft__tsdoc-config@0.17.1.patch

peerDependencyRules:
  allowAny:
    - '*'
  ignoreMissing:
    - '*'

publicHoistPattern:
  - '*eslint*'
  - '*prettier*'
  - '*@rushstack/node-core-library*'
  - '*jju*'

updateConfig:
  ignoreDependencies:
    - jsdoc-to-markdown
    - typedoc
